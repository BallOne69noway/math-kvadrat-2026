<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATH KVADRAT 2026</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <!-- Экран авторизации (по умолчанию открыт) -->
    <div id="auth-screen" class="screen" style="display: block;">
        <div class="auth-card">
            <h2>MATH KVADRAT 2026</h2>
            <p>Вход в систему</p>
            <input type="text" id="login-field" placeholder="Логин (admin / vol1 / teacher1 / room1 / hall)">
            <input type="password" id="pass-field" placeholder="Пароль">
            <button onclick="tryLogin()">Войти</button>
        </div>
    </div>

    <!-- Экран волонтёра -->
    <div id="volunteer-screen" class="screen">
        <div class="container">
            <div class="badge">Волонтёр</div>
            <h2>Ввод ответов</h2>
            
            <label>Команда:</label>
            <select id="vol-select-team"></select>

            <label>Задача:</label>
            <select id="vol-select-task"></select>

            <label>Ответ команды:</label>
            <input type="text" id="vol-ans" placeholder="Введите ответ...">

            <button id="send-btn" onclick="sendSubmission()">ОТПРАВИТЬ ЖЮРИ</button>
        </div>
    </div>

    <!-- Экран учителя / жюри -->
    <div id="teacher-screen" class="screen">
        <div class="teacher-layout">
            <div class="main-panel">
                <div class="badge">Проверка</div>
                <h2>Панель жюри</h2>
                
                <label>Команда:</label>
                <select id="select-team" onchange="refreshStatusBanner()"></select>

                <label>Задача:</label>
                <select id="select-task" onchange="refreshStatusBanner()"></select>

                <label>Ответ участников:</label>
                <input type="text" id="view-ans" readonly placeholder="Выберите из очереди...">

                <!-- Подсказка ИИ -->
                <div id="ai-suggestion-box" class="ai-banner" style="display: none;">
                    <div class="ai-badge">🤖 Gemini AI</div>
                    <p id="ai-verdict-text" style="font-weight: bold; margin: 5px 0;"></p>
                    <p id="ai-reason-text" style="font-size: 13px; opacity: 0.8; margin: 0;"></p>
                </div>

                <!-- Баннер текущего статуса -->
                <div id="status-banner"></div>

                <div class="action-btns">
                    <button class="btn-ok" onclick="setResult('ok')">ВЕРНО ✅</button>
                    <button class="btn-fail" onclick="setResult('fail')">ОШИБКА ❌</button>
                </div>
            </div>

            <!-- Очередь ответов -->
            <div class="sidebar">
                <h3>Очередь ответов</h3>
                <div id="answers-queue"></div>
            </div>
        </div>
    </div>

    <!-- Экран комнат и общего табло -->
    <div id="room-screen" class="screen">
        <div class="container wide">
            <h2 id="room-title">ТАБЛО</h2>
            <div id="tables-container"></div>
        </div>
    </div>

    <!-- Экран победителей -->
    <div id="winners-screen">
        <div class="container wide">
            <h2>🏆 Победители олимпиады</h2>
            <div id="winners-container"></div>
        </div>
    </div>

    <!-- Админ-панель -->
    <div id="admin-screen" class="screen">
        <div class="container">
            <div class="badge">Admin Panel</div>
            <h2>Управление</h2>
            
            <div class="admin-block">
                <label>Количество учителей:</label>
                <input type="number" id="setup-teachers" min="1" max="10" value="1">
                <button onclick="saveAdminConfig()">Сохранить настройки</button>
            </div>

            <hr>

            <div class="admin-block">
                <h3>Штрафные баллы</h3>
                <input type="text" id="penalty-team" placeholder="Команда (напр. 4.1)">
                <input type="number" id="penalty-val" placeholder="Баллы">
                <button onclick="applyPenalty()">Применить штраф</button>
            </div>

            <hr>

            <div class="admin-block">
                <button onclick="showWinners()" style="background: #f59e0b; color: #000;">Показать победителей</button>
                <button onclick="fullReset()" style="background: var(--red); margin-top: 15px; color: white;">⚠️ ПОЛНЫЙ СБРОС (MASTER RESET)</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
